# Diagnostic for K8, not for merging. Does a CPU target other than the native one avoid the wrong
# `DDb♭` values on AMD Zen 4 and Zen 5 runners? Each job runs the probe twice on Julia `min`, with
# the latest dependencies and no depot cache: once with the native target, which shows whether the
# runner reproduces K8, and once with the target of the job, which precompiles anew for it.

name: K8 diagnostic

on:
    pull_request:

permissions:
    contents: read

jobs:
    probe:
        name: K8 - ${{ matrix.target }} - ${{ matrix.rep }}
        runs-on: ubuntu-latest
        timeout-minutes: 150
        env:
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                target: [znver3, generic, "native,-avx512f"]
                rep: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: min
            - uses: julia-actions/julia-buildpkg@v1
            - name: CPU
              run: lscpu | grep -E 'Model name' | cut -c1-200
            - name: Probe, native target
              id: native
              continue-on-error: true
              run: julia --check-bounds=auto --project=. .github/k8/probe.jl k8-out/native
            - name: Probe, target ${{ matrix.target }}
              id: target
              continue-on-error: true
              env:
                  TARGET: ${{ matrix.target }}
              run: julia -C "$TARGET" --check-bounds=auto --project=. .github/k8/probe.jl k8-out/target
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: k8-${{ strategy.job-index }}
                  path: k8-out
            - name: Verdict
              if: always()
              env:
                  NATIVE: ${{ steps.native.outcome }}
                  TARGET: ${{ steps.target.outcome }}
              run: |
                  echo "native: $NATIVE, ${{ matrix.target }}: $TARGET"
                  test "$TARGET" = success
