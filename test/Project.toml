# the tests identify its messages by originating module name rather than by importing it.
[compat]
CairoMakie = "0.15"
GeometricIntegrators = "0.18"
LaTeXStrings = "1"
LinearAlgebra = "1"
Logging = "1"
PoincareInvariants = "0.5"
